<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">প্রশ্নোত্তর</div>
    <button class="menu-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">হোম</a></li>
      <li><a href="exam.html">পরীক্ষা</a></li>

  <div class="container" style="max-width:400px; margin-top:60px;">
    <div class="card text-center">
      <h2>লগইন</h2>
      <input type="email" id="email" placeholder="ইমেইল" class="mt-4"><br>
      <input type="password" id="password" placeholder="পাসওয়ার্ড" class="mt-4"><br>
      <button onclick="login()" class="btn-primary" style="width:100%; margin-top:20px;">লগইন</button>
      <p class="mt-4">একাউন্ট নেই? <a href="signup.html">সাইন আপ করুন</a></p>
    </div>
  </div>

  <!-- Mobile menu script – keep separate so it always works -->
  <script>
    (function() {
      const toggleBtn = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      if (toggleBtn && navLinks) {
        toggleBtn.addEventListener('click', function() {
          navLinks.classList.toggle('active');
        });
      }
    })();
  </script>

  <!-- Supabase & login logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ Replace with your real Supabase URL and anon key
    const SUPABASE_URL = 'https://gdqeryiyqypgnwdohtpz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcWVyeWl5cXlwZ253ZG9odHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTczMTQsImV4cCI6MjA5NTA3MzMxNH0.w1RpfTaL6d0DgQzoOZSTRHsY0Zlyey-DFx8LtCgT6m0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert(error.message);
        return;
      }
      window.location.href = 'exam.html';
    }
  </script>
</body>
</html>
