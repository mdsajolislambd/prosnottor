<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><title>লগইন - প্রশ্নোত্তর</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar"><div class="nav-brand">প্রশ্নোত্তর</div></nav>
  <div class="container" style="max-width:400px; margin-top:60px;">
    <div class="card text-center">
      <h2>লগইন</h2>
      <input type="email" id="email" placeholder="ইমেইল" class="mt-4"><br>
      <input type="password" id="password" placeholder="পাসওয়ার্ড" class="mt-4"><br>
      <button onclick="login()" class="btn-primary" style="width:100%; margin-top:20px;">লগইন</button>
      <p class="mt-4">একাউন্ট নেই? <a href="signup.html">সাইন আপ করুন</a></p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    async function login(){
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({email, password});
      if(error){ alert(error.message); return; }
      window.location.href = 'exam.html';
    }
  </script>
</body>
</html>
