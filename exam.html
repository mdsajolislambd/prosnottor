<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাইভ পরীক্ষা - প্রশ্নোত্তর</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .option {
      display: flex; align-items: center;
      padding: 14px 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      cursor: pointer; margin: 10px 0; transition: all 0.2s;
    }
    .option:hover { border-color: var(--gold); }
    .option.selected { background: var(--gold); color: #0d0f13; border-color: var(--gold); }
    .timer { font-size: 2.5rem; font-weight: 700; color: var(--gold); }
    .btn { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0d0f13; border: none; padding: 14px 30px; border-radius: 40px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px; }
    .correct { color: var(--success); }
    .wrong { color: var(--danger); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">প্রশ্নোত্তর</div>
    <ul class="nav-links">
      <li><a href="index.html">হোম</a></li>
      <li><a href="exam.html">পরীক্ষা</a></li>
      <li><a href="leaderboard.html">লিডারবোর্ড</a></li>
      <li><a href="pricing.html">প্রিমিয়াম</a></li>
      <li><a href="about.html">আমাদের সম্পর্কে</a></li>
      <li><a href="contact.html">যোগাযোগ</a></li>
    </ul>
  </nav>

  <div class="container">
    <div id="authGate" style="display:none;">
      <div class="card">
        <h2>অনুগ্রহ করে লগইন করুন</h2>
        <p>আপনার প্রিমিয়াম একাউন্ট প্রয়োজন।</p>
        <a href="login.html" class="btn-primary">লগইন</a>
      </div>
    </div>
    <div id="examContent" style="display:none;">
      <div class="card" style="text-align:center;">
        <h1>লাইভ পরীক্ষা</h1>
        <div class="timer" id="timerDisplay">60:00</div>
        <div style="margin-top:15px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
          <label>বিষয়: 
            <select id="categorySelect" onchange="loadQuestions()">
              <option value="">সকল প্রশ্ন</option>
            </select>
          </label>
          <label>আপনার নাম: <input type="text" id="playerName" placeholder="নাম লিখুন" style="background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px;"></label>
        </div>
      </div>

      <div id="questionsContainer" style="margin-top:20px;"></div>
      <button class="btn" id="submitBtn">পরীক্ষা শেষ করুন</button>

      <div id="resultContainer" style="display:none;" class="card mt-4">
        <h2>ফলাফল</h2>
        <p>সঠিক: <span id="correctCount">0</span> | ভুল: <span id="wrongCount">0</span> | বাদ: <span id="skippedCount">0</span></p>
        <p>মোট নম্বর: <strong id="finalScore">0.00</strong></p>
        <div id="detailedResult"></div>
        <button class="btn" onclick="downloadPDF()">📥 পিডিএফ ডাউনলোড</button>
        <button class="btn" onclick="location.reload()">আবার পরীক্ষা দিন</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let questions = [], answers = {}, timer, timeLeft = 60 * 60;

    // Authentication & Subscription Guard
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        document.getElementById('authGate').style.display = 'block';
        return;
      }
      const { data: sub } = await supabaseClient.from('subscriptions')
        .select('*').eq('user_id', session.user.id).eq('status', 'active').maybeSingle();
      if (!sub || new Date(sub.expires_at) < new Date()) {
        document.getElementById('authGate').style.display = 'block';
        return;
      }
      document.getElementById('examContent').style.display = 'block';
      loadCategories();
      loadQuestions();
    })();

    async function loadCategories() {
      const { data, error } = await supabaseClient.from('questions').select('category');
      if (error) return;
      const cats = new Set();
      data.forEach(r => r.category.split(',').forEach(c => cats.add(c.trim())));
      const sel = document.getElementById('categorySelect');
      cats.forEach(c => { let o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
    }

    async function loadQuestions() {
      const cat = document.getElementById('categorySelect').value;
      let q = supabaseClient.from('questions').select('*');
      if (cat) q = q.ilike('category', `%${cat}%`);
      const { data, error } = await q;
      if (error) { alert('প্রশ্ন লোড করতে সমস্যা হয়েছে'); return; }
      questions = data.sort(()=>Math.random()-0.5).slice(0,75);
      renderQuestions();
      startTimer();
    }

    function renderQuestions() {
      const cont = document.getElementById('questionsContainer');
      cont.innerHTML = questions.map((q,idx) => `
        <div class="card" style="margin-bottom:16px;">
          <h3 style="color:var(--gold-light);">${idx+1}. ${q.title}</h3>
          <div>${JSON.parse(q.options).map((opt,i) => {
            const letter = String.fromCharCode(65+i);
            return `<div class="option" data-qid="${q.id}" data-value="${letter}" onclick="selectAnswer(${q.id},'${letter}',this)">
              <span style="font-weight:700;margin-right:12px;">${letter})</span> ${opt}
            </div>`;
          }).join('')}</div>
        </div>
      `).join('');
    }

    window.selectAnswer = (qId,val,el) => {
      document.querySelectorAll(`.option[data-qid="${qId}"]`).forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
      answers[qId]=val;
    };

    function startTimer() {
      timer = setInterval(()=>{
        if (timeLeft<=0){ clearInterval(timer); submitExam(); return; }
        timeLeft--;
        const m=Math.floor(timeLeft/60), s=timeLeft%60;
        document.getElementById('timerDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      },1000);
    }

    document.getElementById('submitBtn').addEventListener('click',()=>{
      if(confirm('পরীক্ষা শেষ করতে চান?')){ clearInterval(timer); submitExam(); }
    });

    async function submitExam() {
      document.getElementById('submitBtn').disabled=true;
      let correct=0, wrong=0, skipped=0, html='';
      questions.forEach((q,idx)=>{
        const userAns = answers[q.id];
        const isCorrect = userAns===q.correct_answer;
        if(userAns===undefined) skipped++;
        else if(isCorrect) correct++;
        else wrong++;
        const correctOpt = JSON.parse(q.options)[q.correct_answer.charCodeAt(0)-65];
        html += `<div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
          <strong>${idx+1}. ${q.title}</strong><br>
          আপনার উত্তর: <span class="${isCorrect?'correct':'wrong'}">${userAns||'দেওয়া হয়নি'}</span>
          ${!isCorrect?` | সঠিক: <span class="correct">${q.correct_answer}. ${correctOpt}</span>`:''}
          ${q.explanation?`<br><small>${q.explanation}</small>`:''}
        </div>`;
      });
      const score = correct - (wrong*0.25);
      document.getElementById('correctCount').textContent=correct;
      document.getElementById('wrongCount').textContent=wrong;
      document.getElementById('skippedCount').textContent=skipped;
      document.getElementById('finalScore').textContent=score.toFixed(2);
      document.getElementById('detailedResult').innerHTML=html;
      document.getElementById('questionsContainer').style.display='none';
      document.getElementById('submitBtn').style.display='none';
      document.getElementById('resultContainer').style.display='block';

      const player = document.getElementById('playerName').value.trim()||'Anonymous';
      const category = document.getElementById('categorySelect').value||'all';
      await supabaseClient.from('leaderboard').insert({ player_name:player, score, category });
    }

    function downloadPDF() {
      const el = document.getElementById('detailedResult');
      html2pdf().set({margin:0.5, filename:'exam-result.pdf', image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'in',format:'letter',orientation:'portrait'}}).from(el).save();
    }
  </script>
</body>
</html>
